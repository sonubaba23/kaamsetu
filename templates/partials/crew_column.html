<div class="rounded-2xl border border-white/8 bg-white/[0.03] p-4">
  <div class="flex items-center gap-2">
    <i data-lucide="{{ icon }}" class="h-3.5 w-3.5 {{ color_cls }}"></i>
    <p class="text-xs font-semibold uppercase tracking-wide text-white/60">{{ title }}</p>
    <span class="ml-auto text-xs text-white/40">{{ bookings|length }}</span>
  </div>
  <div class="mt-3 space-y-2">
    {% for b in bookings %}
    <div class="rounded-xl bg-white/[0.04] p-3">
      <p class="text-sm font-medium text-white">{{ b.worker }}</p>
      <p class="mt-0.5 text-xs text-white/45">{{ b.job.title }}</p>
      <p class="mt-1 text-xs text-white/50">{{ b.worker.skill_category }} &middot; &#8377;{{ b.agreed_wage }}</p>
    </div>
    {% empty %}
    <p class="text-xs text-white/35">Nothing here yet.</p>
    {% endfor %}
  </div>
</div>
