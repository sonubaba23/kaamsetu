<div class="reveal glass-card group relative overflow-hidden p-6" data-tilt>
  <span class="font-display text-5xl font-bold text-white/10">{{ n }}</span>
  <span class="absolute right-6 top-6 grid h-10 w-10 place-items-center rounded-xl bg-white/5 text-cyan-glow transition group-hover:bg-white/10">
    <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
  </span>
  <p class="mt-4 text-base font-semibold text-white">{{ title }}</p>
  <p class="mt-2 text-sm leading-relaxed text-white/55">{{ desc }}</p>
</div>
